{% extends "base.html" %}
{% block title %}Login | Student Task Manager{% endblock %}
{% block container_class %}narrow{% endblock %}
{% block content %}
<section class="auth-card">
    <h1>Student Task Manager</h1>
    <p class="muted">Sign in to manage your tasks.</p>
    <form method="post" action="{{ url_for('auth.login') }}" data-validate="login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn btn-primary">Login</button>
        <a class="btn btn-secondary" href="{{ url_for('auth.register') }}">Create Account</a>
    </form>
</section>
{% endblock %}
