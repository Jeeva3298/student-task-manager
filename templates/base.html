<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Task Manager{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% if user is defined and user %}
    <header class="nav">
        <a class="brand" href="{{ url_for('task.dashboard') }}">Student Task Manager</a>
        <nav>
            <a href="{{ url_for('task.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('task.add_task') }}">Add Task</a>
            <form method="post" action="{{ url_for('auth.logout') }}" class="nav-logout-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="nav-logout">Logout</button>
            </form>
        </nav>
    </header>
    {% endif %}

    <main class="container {% block container_class %}{% endblock %}">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
