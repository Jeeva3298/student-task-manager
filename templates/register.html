{% extends "base.html" %}
{% block title %}Register | Student Task Manager{% endblock %}
{% block container_class %}narrow{% endblock %}
{% block content %}
<section class="auth-card">
    <h1>Create Account</h1>
    <p class="muted">Register to start tracking your tasks.</p>
    <form method="post" action="{{ url_for('auth.register') }}" data-validate="register">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="6" required>

        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" minlength="6" required>

        <button type="submit" class="btn btn-primary">Create Account</button>
    </form>
    <p class="auth-alt">
        Already have an account?
        <a href="{{ url_for('auth.login') }}">Login</a>
    </p>
</section>
{% endblock %}
